name: update
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -U yt-dlp requests
      - name: M3U olustur
        env:
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
          YT_PO_TOKEN: ${{ secrets.YT_PO_TOKEN }}
          YT_VISITOR_DATA: ${{ secrets.YT_VISITOR_DATA }}
        run: python you.py
      - name: Dosyalari kaydet
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add m3u_files/
          git commit -m "update" || echo "degisiklik yok"
          git push
